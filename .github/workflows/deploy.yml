# Deploy on green, never on push alone.
#
# Fires when ci finishes successfully on main, so a red commit cannot reach production.
# Database migrations are applied by the Supabase GitHub integration on merge to main;
# this workflow ships the web app (Cloudflare Pages) and the Edge Functions.
#
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY,
#          SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF.
# Variables (optional): VITE_AUTH_APPLE.
name: deploy

on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  functions:
    name: Edge Functions to Supabase
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Fail loudly without a deploy token
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$REF" ]; then
            echo "SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF must be set, or main goes green while the functions stay old."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy --project-ref "$REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}

  web:
    name: Web app to Cloudflare Pages
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Vite inlines VITE_* at build time; a bundle built without them can't sign anyone in.
      # Refuse to build rather than deploy one. Same guards as Kadar's deploy.
      - name: Fail loudly without the credentials the build needs
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SB_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SB_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          for v in CF_TOKEN CF_ACCOUNT SB_URL SB_KEY; do
            if [ -z "${!v}" ]; then echo "$v is not set."; exit 1; fi
          done
          if ! printf '%s' "$SB_URL" | grep -Eq '^https://[a-z0-9]+\.supabase\.co$'; then
            echo "VITE_SUPABASE_URL must be exactly https://<project-ref>.supabase.co (.co, no path)."
            exit 1
          fi
          case "$SB_KEY" in
            sb_publishable_*) ;;
            sb_secret_*)
              echo "VITE_SUPABASE_ANON_KEY is a SECRET key. It would be inlined into a public bundle. Use the publishable key."
              exit 1 ;;
            eyJ*)
              payload=$(printf '%s' "$SB_KEY" | cut -d. -f2 | tr '_-' '/+')
              while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
              role=$(printf '%s' "$payload" | base64 -d 2>/dev/null | grep -o '"role" *: *"[^"]*"' | sed 's/.*"\([^"]*\)"$/\1/')
              if [ "$role" != "anon" ]; then
                echo "VITE_SUPABASE_ANON_KEY is a JWT with role '${role:-unreadable}', not anon. Never ship the service_role key."
                exit 1
              fi ;;
            *)
              echo "VITE_SUPABASE_ANON_KEY is not a Supabase browser key (sb_publishable_... or an anon JWT)."
              exit 1 ;;
          esac
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_AUTH_APPLE: ${{ vars.VITE_AUTH_APPLE }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=80ways --branch=main
