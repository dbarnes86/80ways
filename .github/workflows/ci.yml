name: ci

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Game rules, billing rules and component tests.
      - run: npm test
      - run: npm run build
