# Supabase CLI project config. Migrations live in supabase/migrations and are applied to
# production by the Supabase GitHub integration on merge to main. Edge functions are deployed
# by .github/workflows/deploy.yml after CI passes.
project_id = "80ways"

[functions.billing]
verify_jwt = true
import_map = "./functions/import_map.json"

# Stripe signs the request; it carries no Supabase token.
[functions.stripe-webhook]
verify_jwt = false
import_map = "./functions/import_map.json"

# The app sends a StoreKit 2 transaction after a purchase or restore.
[functions.apple-iap]
verify_jwt = true
import_map = "./functions/import_map.json"

# App Store Server Notifications V2. Apple signs the payload; it carries no Supabase token.
[functions.appstore-notifications]
verify_jwt = false
import_map = "./functions/import_map.json"
